name: CI

on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    container: erlang:${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28', '27', '26', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile
        run: rebar3 compile

      - name: EUnit
        run: rebar3 eunit

      - name: Common Test
        run: rebar3 ct
